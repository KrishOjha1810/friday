<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Friday">
<title>Friday</title>
<style>
  /* One thread is the spine. A thin fleet strip sits above it so status is
     glanceable without turning the conversation into a log. Everything is
     sized for a phone first, because the phone is the harder case. */
  :root{
    --bg:#0b0d12; --panel:#12151d; --line:#1e2330; --ink:#e7ebf3;
    --dim:#8b94a7; --me:#1d4ed8; --accent:#5eead4; --warn:#fbbf24;
    --alert:#f87171; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- fleet strip -------------------------------------------------- */
  header{
    flex:none; border-bottom:1px solid var(--line); background:var(--panel);
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
  }
  .brand{display:flex; align-items:center; gap:9px; margin-bottom:9px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
       box-shadow:0 0 10px rgba(94,234,212,.6)}
  .brand h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .brand .sub{color:var(--dim);font-size:12px;margin-left:auto}
  .fleet{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .fleet::-webkit-scrollbar{display:none}
  .chip{
    flex:none; display:flex; align-items:center; gap:6px; cursor:pointer;
    background:#171b26; border:1px solid var(--line); color:var(--ink);
    border-radius:999px; padding:6px 11px; font-size:12.5px; white-space:nowrap;
  }
  .chip .sd{width:7px;height:7px;border-radius:50%;background:#4b5563}
  .chip.working .sd{background:var(--warn);animation:pulse 1.6s infinite}
  .chip.needs{border-color:#7f3a3a;background:#2a1518}
  .chip.needs .sd{background:var(--alert)}
  .chip.idle .sd{background:#3f9e7a}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .empty-fleet{color:var(--dim);font-size:12.5px;padding:2px}

  /* ---- the thread ----------------------------------------------------- */
  main{flex:1; overflow-y:auto; padding:16px 12px 8px; -webkit-overflow-scrolling:touch}
  .msg{max-width:min(680px,88%); margin:0 auto 12px; display:flex}
  .msg .b{padding:10px 13px; border-radius:var(--radius); white-space:pre-wrap;
          word-wrap:break-word}
  .msg.user{justify-content:flex-end}
  .msg.user .b{background:var(--me); color:#fff; border-bottom-right-radius:5px}
  .msg.friday .b{background:var(--panel); border:1px solid var(--line);
                 border-bottom-left-radius:5px}
  /* Friday starting the conversation looks different from Friday answering:
     you should always be able to tell who spoke first. */
  .msg.proactive .b{border-left:3px solid var(--accent); background:#111a1c}
  .msg.proactive .who{color:var(--accent)}
  .who{font-size:11px; color:var(--dim); margin-bottom:3px; letter-spacing:.3px;
       text-transform:uppercase}
  .confirm{display:flex; gap:8px; margin:2px auto 14px; max-width:min(680px,88%)}
  .confirm button{
    border:1px solid var(--line); background:#171b26; color:var(--ink);
    border-radius:10px; padding:8px 16px; font-size:14px; cursor:pointer;
  }
  .confirm button.go{background:var(--accent); color:#04211c; border-color:transparent;
                     font-weight:600}
  .thinking{color:var(--dim); font-style:italic; max-width:min(680px,88%);
            margin:0 auto 12px}

  /* ---- composer ------------------------------------------------------- */
  footer{
    flex:none; border-top:1px solid var(--line); background:var(--panel);
    padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);
  }
  .row{display:flex; gap:8px; align-items:flex-end; max-width:700px; margin:0 auto}
  textarea{
    flex:1; resize:none; background:#0e1118; color:var(--ink); font:inherit;
    border:1px solid var(--line); border-radius:12px; padding:10px 12px;
    max-height:120px; min-height:42px;
  }
  textarea:focus{outline:none; border-color:#2f3a52}
  .icon{
    flex:none; width:42px; height:42px; border-radius:12px; cursor:pointer;
    border:1px solid var(--line); background:#171b26; color:var(--ink);
    display:grid; place-items:center; font-size:17px;
  }
  .icon.on{background:var(--accent); color:#04211c; border-color:transparent}
  .hint{color:var(--dim); font-size:11.5px; text-align:center; margin-top:7px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot" id="live"></span>
    <h1>Friday</h1>
    <span class="sub" id="sub">connecting…</span>
  </div>
  <div class="fleet" id="fleet"><span class="empty-fleet">no sessions yet</span></div>
</header>

<main id="thread"></main>

<footer>
  <div class="row">
    <button class="icon" id="mic" title="Talk instead of typing" aria-label="Talk">🎙</button>
    <textarea id="input" rows="1" placeholder="Ask Friday, or just talk…"></textarea>
    <button class="icon" id="send" title="Send" aria-label="Send">↑</button>
  </div>
  <div class="hint" id="hint">try: what's running? · open jobhunt · tell api to use redis · quiet</div>
</footer>

<script>
const $ = id => document.getElementById(id);
const thread = $('thread'), input = $('input'), sub = $('sub');
let pendingConfirm = false;

function atBottom(){ return thread.scrollHeight - thread.scrollTop - thread.clientHeight < 80; }
function scroll(force){ if(force || atBottom()) thread.scrollTop = thread.scrollHeight; }

function bubble(role, text, kind){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'friday')
                 + (kind === 'proactive' ? ' proactive' : '');
  const b = document.createElement('div'); b.className = 'b';
  if(role !== 'user'){
    const who = document.createElement('div'); who.className = 'who';
    who.textContent = kind === 'proactive' ? 'Friday · heads up' : 'Friday';
    b.appendChild(who);
  }
  b.appendChild(document.createTextNode(text));
  wrap.appendChild(b);
  thread.appendChild(wrap);
  scroll();
  return wrap;
}

function askConfirm(){
  pendingConfirm = true;
  const row = document.createElement('div'); row.className = 'confirm';
  const yes = document.createElement('button'); yes.className = 'go'; yes.textContent = 'Yes';
  const no  = document.createElement('button'); no.textContent = 'No';
  const done = ans => { row.remove(); pendingConfirm = false; send(ans); };
  yes.onclick = () => done('yes');
  no.onclick  = () => done('no');
  row.append(yes, no);
  thread.appendChild(row); scroll(true);
}

let thinkingEl = null;
function thinking(on){
  if(on && !thinkingEl){
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'thinking'; thinkingEl.textContent = 'Friday is thinking…';
    thread.appendChild(thinkingEl); scroll();
  } else if(!on && thinkingEl){ thinkingEl.remove(); thinkingEl = null; }
}

async function send(text){
  text = (text !== undefined ? text : input.value).trim();
  if(!text) return;
  input.value = ''; input.style.height = 'auto';
  bubble('user', text);
  thinking(true);
  try{
    const r = await fetch('/say', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})});
    const j = await r.json();
    thinking(false);
    if(j.reply) bubble('friday', j.reply);
    if(j.needs_confirm) askConfirm();
  }catch(e){ thinking(false); bubble('friday', "I couldn't reach my own server."); }
}

$('send').onclick = () => send();
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(120, input.scrollHeight) + 'px';
});
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

/* ---- fleet strip ------------------------------------------------------ */
function renderFleet(rows){
  const el = $('fleet');
  el.textContent = '';
  if(!rows || !rows.length){
    const s = document.createElement('span');
    s.className = 'empty-fleet'; s.textContent = 'no sessions yet';
    el.appendChild(s); return;
  }
  rows.forEach(r => {
    const c = document.createElement('button');
    c.className = 'chip ' + (r.status === 'needs' ? 'needs'
                  : (r.status === 'working' ? 'working' : 'idle'));
    const d = document.createElement('span'); d.className = 'sd';
    c.append(d, document.createTextNode(r.label || 'session'));
    c.title = r.needs || r.status;
    /* tapping a chip asks about it in the thread: the strip is a shortcut
       into the conversation, never a second place to work */
    c.onclick = () => send(r.status === 'needs'
      ? ('what does ' + r.label + ' need?') : ('open ' + r.label));
    el.appendChild(c);
  });
}

/* ---- live ------------------------------------------------------------- */
function connect(){
  const es = new EventSource('/events');
  es.onopen = () => { sub.textContent = 'listening'; };
  es.onerror = () => { sub.textContent = 'reconnecting…'; };
  es.onmessage = e => {
    let d; try{ d = JSON.parse(e.data); }catch(x){ return; }
    if(d.kind === 'fleet') renderFleet(d.rows);
    if(d.kind === 'message' && d.message){
      bubble('friday', d.message.text, d.message.kind);
      if(document.hidden) notify(d.message.text);
    }
  };
}

/* Notifications work in a plain localhost tab, no install and no signing. */
function notify(text){
  try{
    if(Notification.permission === 'granted') new Notification('Friday', {body:text});
  }catch(e){}
}
document.addEventListener('click', function once(){
  try{ if(Notification.permission === 'default') Notification.requestPermission(); }catch(e){}
  document.removeEventListener('click', once);
});

/* ---- boot ------------------------------------------------------------- */
(async function boot(){
  try{
    const s = await (await fetch('/state')).json();
    renderFleet(s.fleet);
    (s.history || []).forEach(m => bubble(m.role, m.text, m.kind));
    if(!s.engine.voicebridge) bubble('friday', 'I cannot see voicebridge, so I am half blind: ' + s.engine.reason);
    else if(!s.engine.brain) bubble('friday', 'My brain is not loaded yet, so I will keep answers short.');
    else if(!(s.history || []).length) bubble('friday', "I'm watching your sessions. Ask me what's running.");
    scroll(true);
  }catch(e){}
  connect();
})();
</script>
</body>
</html>
