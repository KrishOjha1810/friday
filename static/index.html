<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Friday">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Friday">
<title>Friday</title>
<style>
  /* ---------------------------------------------------------------------
     Friday is a supervisor, not a chatbot. Two type roles carry that:
     conversation is set in the system sans, while session names, states and
     counts are MONO, because those are machine facts and should read as such.
     One accent (teal) belongs to Friday's own voice and presence; amber means
     an agent is working, red means a human is needed. Nothing else is coloured.
     --------------------------------------------------------------------- */
  :root{
    --void:#0b0d12; --panel:#12151d; --raise:#171b26; --line:#1e2330;
    --ink:#e7ebf3; --dim:#8b94a7; --faint:#5a6478;
    --live:#5eead4;            /* Friday's presence */
    --me:#2563eb;              /* you */
    --wait:#fbbf24;            /* an agent is working */
    --need:#f87171;            /* an agent needs a human */
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--void); color:var(--ink); display:flex; flex-direction:column;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button{font:inherit; color:inherit; cursor:pointer}
  :focus-visible{outline:2px solid var(--live); outline-offset:2px}

  /* ---- header: identity, the call, and the fleet ---------------------- */
  header{
    flex:none; background:var(--panel); border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 11px) 14px 11px;
  }
  .top{display:flex; align-items:center; gap:11px}
  .name{font-size:15px; font-weight:600; letter-spacing:.2px; margin:0}
  .state{
    font:11.5px/1 var(--mono); color:var(--faint); letter-spacing:.4px;
    text-transform:uppercase;
  }
  .grow{flex:1}

  /* THE SIGNATURE: one ring, in one place, carrying three states. During a
     hands-free call it is the only thing you need to glance at. */
  .ring{position:relative; width:26px; height:26px; flex:none;
        display:grid; place-items:center}
  .ring i{position:absolute; inset:0; border-radius:50%;
          border:1.5px solid var(--line); transition:transform .1s}
  .ring b{width:8px; height:8px; border-radius:50%; background:var(--faint);
          transition:background .2s}
  body[data-call="on"] .ring i{border-color:rgba(94,234,212,.35)}
  body[data-call="on"] .ring b{background:var(--live)}
  body[data-mode="hearing"] .ring i{
    border-color:var(--live);
    transform:scale(calc(1 + var(--lvl, 0) * .3));
    box-shadow:0 0 0 calc(var(--lvl, 0) * 7px) rgba(94,234,212,.10);
  }
  body[data-mode="thinking"] .ring i{
    border-color:transparent; border-top-color:var(--live);
    animation:spin 900ms linear infinite;
  }
  body[data-mode="speaking"] .ring i{
    border-color:var(--live); animation:breathe 1.5s ease-in-out infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(94,234,212,.28)}
                     50%{box-shadow:0 0 0 7px rgba(94,234,212,0)}}

  .btn{
    display:inline-flex; align-items:center; gap:7px; background:var(--raise);
    border:1px solid var(--line); border-radius:10px; padding:7px 12px;
    font-size:13px; transition:background .15s, border-color .15s;
  }
  .btn:hover{background:#1c2130}
  .btn svg{width:15px; height:15px; flex:none}
  .btn.call{border-color:rgba(94,234,212,.3); color:var(--live)}
  .btn.hang{background:#2a1518; border-color:#7f3a3a; color:#ffd9d9}

  /* ---- fleet strip: state first, mono, real counts -------------------- */
  .fleet{display:flex; gap:7px; margin-top:10px; overflow-x:auto;
         scrollbar-width:none; align-items:center}
  .fleet::-webkit-scrollbar{display:none}
  .count{font:11.5px/1 var(--mono); color:var(--dim); letter-spacing:.3px;
         white-space:nowrap; padding-right:3px}
  .count.needs{color:var(--need)}
  .sess{
    flex:none; display:flex; align-items:center; gap:6px; background:var(--raise);
    border:1px solid var(--line); border-radius:8px; padding:5px 10px;
    font:12px/1 var(--mono); white-space:nowrap;
  }
  .sess .d{width:6px; height:6px; border-radius:50%; background:var(--faint)}
  .sess.working .d{background:var(--wait); animation:blink 1.7s infinite}
  .sess.needs{border-color:#7f3a3a; background:#241417; color:#ffd9d9}
  .sess.needs .d{background:var(--need)}
  .sess.idle .d{background:#3f9e7a}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* ---- thread --------------------------------------------------------- */
  main{flex:1; overflow-y:auto; overflow-anchor:auto; padding:18px 14px 10px;
       -webkit-overflow-scrolling:touch}
  .turn{max-width:min(700px,90%); margin:0 auto 13px}
  .turn.you{display:flex; justify-content:flex-end}
  .bub{padding:10px 13px; border-radius:13px; white-space:pre-wrap;
       word-wrap:break-word; max-width:100%}
  .turn.you .bub{background:var(--me); border-bottom-right-radius:4px}
  .turn.fri .bub{background:var(--panel); border:1px solid var(--line);
                 border-bottom-left-radius:4px}
  /* Friday starting the conversation is a different act from Friday replying */
  .turn.first .bub{background:#101a1c; border-color:rgba(94,234,212,.28);
                   border-left:2px solid var(--live)}
  .from{font:10.5px/1 var(--mono); color:var(--faint); letter-spacing:.5px;
        text-transform:uppercase; margin-bottom:5px}
  .turn.first .from{color:var(--live)}
  .spoke{opacity:.78}                      /* was said out loud during a call */
  .ask{display:flex; gap:8px; margin:0 auto 14px; max-width:min(700px,90%)}
  .ask button{background:var(--raise); border:1px solid var(--line);
              border-radius:9px; padding:8px 16px}
  .ask button.yes{background:var(--live); color:#04211c; border-color:transparent;
                  font-weight:600}
  .work{font:12px/1 var(--mono); color:var(--faint); letter-spacing:.4px;
        max-width:min(700px,90%); margin:0 auto 13px}

  /* ---- call bar: docks ABOVE the composer; the thread stays visible --- */
  .callbar{
    flex:none; display:none; align-items:center; gap:12px; background:#0e1a1c;
    border-top:1px solid rgba(94,234,212,.25); padding:11px 16px;
  }
  body[data-call="on"] .callbar{display:flex}
  .callbar .what{font:12px/1 var(--mono); color:var(--live);
                 letter-spacing:.5px; text-transform:uppercase}
  .callbar .hint{font-size:12.5px; color:var(--dim)}

  /* ---- composer ------------------------------------------------------- */
  footer{
    flex:none; background:var(--panel); border-top:1px solid var(--line);
    padding:11px 14px calc(env(safe-area-inset-bottom,0px) + 11px);
  }
  .row{display:flex; gap:8px; align-items:flex-end; max-width:720px; margin:0 auto}
  .ico{
    flex:none; width:40px; height:40px; border-radius:10px; display:grid;
    place-items:center; background:var(--raise); border:1px solid var(--line);
    transition:background .15s, border-color .15s, color .15s;
  }
  .ico svg{width:18px; height:18px}
  .ico:hover{background:#1c2130}
  /* ON is unmistakable: filled, tinted, and the glyph itself changes */
  .ico[aria-pressed="true"]{background:var(--live); color:#04211c;
                            border-color:transparent}
  .ico.rec{background:var(--need); color:#2a0f0f; border-color:transparent}
  textarea{
    flex:1; resize:none; min-height:40px; max-height:130px; padding:9px 12px;
    background:#0e1118; color:var(--ink); border:1px solid var(--line);
    border-radius:11px; font:inherit;
  }
  textarea:focus{outline:none; border-color:#31405e}
  .tip{margin-top:8px; text-align:center; font:11.5px/1.5 var(--mono);
       color:var(--faint)}
  .jump{
    position:fixed; right:18px; bottom:104px; z-index:6; background:var(--panel);
    border:1px solid var(--line); border-radius:999px; padding:8px 14px;
    font:12px/1 var(--mono); box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .jump.needs{background:#2a1518; border-color:#7f3a3a; color:#ffd9d9}
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }

/* The bell has to read as ON or OFF at a glance: an icon that looks the same
   either way is why the old speaker toggle was reported as broken. */
.btn.bell .slash { opacity: 1; }
body[data-push="on"] .btn.bell { color: var(--accent, #5eead4); border-color: currentColor; }
body[data-push="on"] .btn.bell .slash { opacity: 0; }
body[data-push="off"] .btn.bell { opacity: .72; }

/* ---- the peek panel ------------------------------------------------------
   Tapping a session used to type "what does api need?" into the chat and wait.
   The question is already known, so the useful thing is to show it and take the
   answer right here. A bottom sheet on a phone, a panel on a desktop. */
.peek { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45);
        display: flex; align-items: flex-end; justify-content: center; }
/* An author `display` beats the browser's own `[hidden] { display: none }`, so
   without this the overlay is laid out even while hidden: an invisible sheet
   over the whole page, swallowing every click on the app underneath. Nothing
   in the UI was usable and it looked completely normal. */
.peek[hidden] { display: none; }
.peek .sheet { width: min(560px, 100%); background: var(--panel, #12151d);
               border: 1px solid rgba(255,255,255,.09); border-radius: 16px 16px 0 0;
               padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
               display: flex; flex-direction: column; gap: 10px;
               animation: rise .16s ease-out; }
@keyframes rise { from { transform: translateY(14px); opacity: .6; } }
@media (min-width: 700px) {
  .peek { align-items: center; }
  .peek .sheet { border-radius: 16px; }
}
@media (prefers-reduced-motion: reduce) { .peek .sheet { animation: none; } }
.peek .phead { display: flex; align-items: center; gap: 8px; }
.peek .phead b { font-size: 15px; }
.peek .pstate { font-size: 12px; opacity: .6; }
.peek .grow { flex: 1; }
.peek .x { background: none; border: 0; color: inherit; font-size: 22px;
           opacity: .6; cursor: pointer; line-height: 1; }
.peek .pask { margin: 0; font-size: 15px; line-height: 1.45; }
.peek .psuggest { display: flex; flex-wrap: wrap; gap: 6px; }
.peek .psuggest button { border: 1px solid rgba(255,255,255,.16); background: none;
    color: inherit; border-radius: 999px; padding: 6px 12px; font: inherit;
    font-size: 13px; cursor: pointer; }
.peek .psuggest button:hover { border-color: var(--accent, #5eead4); }
.peek .prow { display: flex; gap: 8px; }
.peek .prow input { flex: 1; background: rgba(255,255,255,.05); color: inherit;
    border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 10px 12px;
    font: inherit; }
.peek .prow.acts { justify-content: flex-start; }
.peek .btn.go { background: var(--accent, #5eead4); color: #07131a; border: 0; }
.peek button:focus-visible, .target:focus-visible { outline: 2px solid var(--accent, #5eead4); outline-offset: 2px; }

/* Who a bare message reaches. Routing was inferred and invisible: you found out
   where your words went by watching them arrive somewhere. */
.target { margin: 0 12px 6px; font-size: 12px; opacity: .75;
          display: flex; align-items: center; gap: 6px; }
.target b { font-weight: 600; opacity: .95; }
.target button { background: none; border: 0; color: inherit; opacity: .6;
                 cursor: pointer; font: inherit; text-decoration: underline; }

/* On a phone the strip is a summary, not a list: one line you can tap. */
@media (max-width: 560px) {
  header .fleet { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  header .fleet::-webkit-scrollbar { display: none; }
  header .fleet .sess { flex: 0 0 auto; }
  body[data-calm="1"] header .fleet .sess:not(.needs) { display: none; }
}
</style>
</head>
<body data-call="off" data-mode="idle">

<header>
  <div class="top">
    <span class="ring" aria-hidden="true"><i></i><b></b></span>
    <h1 class="name">Friday</h1>
    <span class="state" id="state">idle</span>
    <span class="grow"></span>
    <button class="btn bell" id="bellBtn" title="Get alerts when this is closed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
      </svg>
    </button>
    <button class="btn call" id="callBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.5-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.7 2z"/>
      </svg>
      <span id="callLbl">Call</span>
    </button>
  </div>
  <div class="fleet" id="fleet"></div>
</header>

<div class="peek" id="peek" hidden>
  <div class="sheet">
    <div class="phead">
      <span class="d" id="peekDot"></span>
      <b id="peekName">session</b>
      <span class="pstate" id="peekState"></span>
      <span class="grow"></span>
      <button class="x" id="peekClose" aria-label="Close">&times;</button>
    </div>
    <p class="pask" id="peekAsk"></p>
    <div class="psuggest" id="peekSuggest"></div>
    <div class="prow">
      <input id="peekReply" placeholder="Answer it" autocomplete="off">
      <button class="btn go" id="peekSend">Send</button>
    </div>
    <div class="prow acts">
      <button class="btn" id="peekOpen">Open window</button>
      <button class="btn" id="peekStop">Stop it</button>
    </div>
  </div>
</div>

<main id="thread"></main>
<button class="jump" id="jump" hidden></button>
<div class="target" id="target" hidden></div>

<div class="callbar">
  <span class="what" id="callWhat">listening</span>
  <span class="hint" id="callHint">just talk, I'll answer out loud</span>
  <span class="grow"></span>
  <button class="btn hang" id="hangBtn">End call</button>
</div>

<footer>
  <div class="row">
    <button class="ico" id="mic" aria-label="Hold to talk" title="Hold to talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" aria-hidden="true">
        <rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor" stroke="none"/>
        <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3.5"/>
      </svg>
    </button>
    <button class="ico" id="ear" aria-pressed="false" aria-label="Read replies aloud"
            title="Read replies aloud">
      <svg id="earIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true"></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Ask Friday, or hold the mic"></textarea>
    <button class="ico" id="send" aria-label="Send" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5"/><path d="M5.5 11.5 12 5l6.5 6.5"/>
      </svg>
    </button>
  </div>
  <div class="tip" id="tip">what's running · what does &lt;name&gt; need · open &lt;name&gt; · tell &lt;name&gt; to …</div>
</footer>

<script>
const KEY = new URLSearchParams(location.search).get('k') || '';
const U = p => p + (KEY ? (p.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(KEY) : '');
const $ = id => document.getElementById(id);
const thread = $('thread'), input = $('input');
const TIP = $('tip').textContent;

let speakBack = false;      // read replies aloud (outside a call)
let inCall = false;         // continuous hands-free conversation
let callMode = 'idle';      // idle | hearing | thinking | speaking

function setMode(m){
  callMode = m;
  document.body.dataset.mode = m;
  $('state').textContent = inCall ? m : (speakBack ? 'reads aloud' : 'idle');
  $('callWhat').textContent = {hearing:'listening', thinking:'thinking',
                               speaking:'speaking'}[m] || 'on a call';
  $('callHint').textContent = m === 'hearing' ? "just talk, I'll answer out loud"
    : m === 'thinking' ? 'working that out…'
    : m === 'speaking' ? 'talking — say anything to cut in' : '';
}
function level(v){ document.documentElement.style.setProperty('--lvl', v.toFixed(3)); }

/* ---- thread ------------------------------------------------------------ */
function atBottom(){ return thread.scrollHeight - thread.scrollTop - thread.clientHeight < 90; }
let unread = 0, unreadAsk = false;
function bumpUnread(isAsk){
  if(atBottom()) return;
  unread++; unreadAsk = unreadAsk || !!isAsk;
  const j = $('jump'); j.hidden = false;
  j.classList.toggle('needs', unreadAsk);
  j.textContent = unread + ' new' + (unreadAsk ? ' · needs you' : '');
}
function clearUnread(){ unread = 0; unreadAsk = false; $('jump').hidden = true; }
$('jump').onclick = () => { thread.scrollTop = thread.scrollHeight; clearUnread(); };
thread.addEventListener('scroll', () => { if(atBottom()) clearUnread(); });

/* Everything lands here, typed or spoken, so a call leaves a readable
   transcript in the same thread instead of vanishing into the air. */
function turn(who, text, opts){
  opts = opts || {};
  const t = document.createElement('div');
  t.className = 'turn ' + (who === 'you' ? 'you' : 'fri') + (opts.first ? ' first' : '');
  const b = document.createElement('div');
  b.className = 'bub' + (opts.spoken ? ' spoke' : '');
  if(who !== 'you'){
    const f = document.createElement('div'); f.className = 'from';
    f.textContent = opts.first ? 'friday · unprompted' : 'friday';
    b.appendChild(f);
  }
  /* Links must be clickable: Friday hands you setup URLs that are hundreds of
     characters long, and a link you have to select by hand is not a link.
     Built with createTextNode + createElement, never innerHTML, so a message
     can never inject markup into the page. */
  linkify(b, text);
  t.appendChild(b); thread.appendChild(t);
  if(!atBottom() && who !== 'you') bumpUnread(opts.first);
  if(atBottom()) thread.scrollTop = thread.scrollHeight;
  return t;
}

const URL_RE = /https?:\/\/[^\s<>"']+/g;
function linkify(el, text){
  let last = 0, m;
  URL_RE.lastIndex = 0;
  while((m = URL_RE.exec(text)) !== null){
    if(m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
    const a = document.createElement('a');
    a.href = m[0]; a.target = '_blank'; a.rel = 'noopener noreferrer';
    /* a 700-character setup URL must not blow up the bubble */
    a.textContent = m[0].length > 60 ? m[0].slice(0, 57) + '…' : m[0];
    a.style.cssText = 'color:var(--live);text-decoration:underline;word-break:break-all';
    el.appendChild(a);
    last = m.index + m[0].length;
  }
  if(last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
}

let workEl = null;
function working(on, label){
  if(on && !workEl){
    workEl = document.createElement('div');
    workEl.className = 'work'; workEl.textContent = label || 'thinking…';
    thread.appendChild(workEl);
    if(atBottom()) thread.scrollTop = thread.scrollHeight;
  }else if(!on && workEl){ workEl.remove(); workEl = null; }
}

function askYesNo(){
  const row = document.createElement('div'); row.className = 'ask';
  const y = document.createElement('button'); y.className = 'yes'; y.textContent = 'Yes';
  const n = document.createElement('button'); n.textContent = 'No';
  const pick = a => { row.remove(); say(a); };
  y.onclick = () => pick('yes'); n.onclick = () => pick('no');
  row.append(y, n); thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
}

/* ---- server ------------------------------------------------------------ */
async function say(text, opts){
  opts = opts || {};
  text = (text !== undefined && text !== null ? text : input.value).trim();
  if(!text) return null;
  if(!opts.fromVoice){ input.value = ''; input.style.height = 'auto'; }
  turn('you', text, {spoken: !!opts.spoken});
  working(true);
  if(inCall) setMode('thinking');
  try{
    const r = await fetch(U('/say'), {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})});
    const j = await r.json();
    working(false);
    if(j.reply) turn('friday', j.reply, {spoken: inCall});
    if(j.needs_confirm) askYesNo();
    if(!inCall && speakBack && j.reply) speak(j.reply, false);
    return j;
  }catch(e){
    working(false);
    turn('friday', "I couldn't reach my own server.");
    return null;
  }
}
function speak(text, wait){
  return fetch(U('/speak'), {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text, wait: !!wait})}).catch(() => {});
}

/* ---- microphone -------------------------------------------------------- */
let stream = null, actx = null, analyser = null, buf = null;
async function mic(){
  if(stream) return stream;
  stream = await navigator.mediaDevices.getUserMedia({audio:{
    echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') await actx.resume();
  const src = actx.createMediaStreamSource(stream);
  analyser = actx.createAnalyser(); analyser.fftSize = 1024;
  src.connect(analyser);
  buf = new Float32Array(analyser.fftSize);
  return stream;
}
function rms(){
  if(!analyser) return 0;
  analyser.getFloatTimeDomainData(buf);
  let s = 0; for(const v of buf) s += v * v;
  return Math.sqrt(s / buf.length);
}
function releaseMic(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  analyser = null; level(0);
}

/* Record until you stop talking. Shared by push-to-talk and the call loop. */
function recordUtterance(o){
  o = o || {};
  const maxSilence = o.silence || 1300, maxLen = o.max || 25000;
  return new Promise(async resolve => {
    try{ await mic(); }catch(e){ resolve(null); return; }
    const rec = new MediaRecorder(stream); const parts = [];
    rec.ondataavailable = e => parts.push(e.data);
    let spoke = false, quietAt = 0, stopped = false;
    const t0 = Date.now();
    const tick = setInterval(() => {
      const v = rms(); level(Math.min(1, v * 12));
      if(v > 0.022){ spoke = true; quietAt = 0; }
      else if(spoke && !quietAt) quietAt = Date.now();
      const done = (spoke && quietAt && Date.now() - quietAt > maxSilence)
                 || Date.now() - t0 > maxLen
                 || (!spoke && Date.now() - t0 > 9000);
      if(done && !stopped){ stopped = true; clearInterval(tick); try{ rec.stop(); }catch(e){} }
    }, 60);
    rec.onstop = () => {
      clearInterval(tick); level(0);
      resolve(spoke ? new Blob(parts, {type: rec.mimeType || 'audio/webm'}) : null);
    };
    rec.start();
    o.onRec && o.onRec(() => {
      if(!stopped){ stopped = true; clearInterval(tick); try{ rec.stop(); }catch(e){} }
    });
  });
}
async function transcribe(blob){
  if(!blob || blob.size < 1200) return '';
  const r = await fetch(U('/stt'), {method:'POST',
    headers:{'Content-Type': blob.type}, body: blob});
  return ((await r.json()).text || '').trim();
}

/* ---- push to talk ------------------------------------------------------ */
let stopHold = null;
const micBtn = $('mic');
async function holdStart(e){
  if(inCall) return;
  if(e) e.preventDefault();
  micBtn.classList.add('rec');
  $('tip').textContent = 'listening… release to send';
  const blob = await recordUtterance({onRec: s => { stopHold = s; }});
  micBtn.classList.remove('rec');
  $('tip').textContent = 'transcribing…';
  const text = await transcribe(blob);
  $('tip').textContent = TIP;
  if(text) say(text, {spoken:true, fromVoice:true});
  else $('tip').textContent = "didn't catch that — hold it a moment longer";
}
function holdEnd(){ if(stopHold){ stopHold(); stopHold = null; } }
micBtn.addEventListener('mousedown', holdStart);
micBtn.addEventListener('mouseup', holdEnd);
micBtn.addEventListener('mouseleave', holdEnd);
micBtn.addEventListener('touchstart', holdStart, {passive:false});
micBtn.addEventListener('touchend', e => { e.preventDefault(); holdEnd(); }, {passive:false});

/* ---- speaker toggle: unmistakably on or off --------------------------- */
const EAR_ON = '<path d="M11 5 6.5 9H3v6h3.5L11 19z" fill="currentColor" stroke="none"/>'
  + '<path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/>';
const EAR_OFF = '<path d="M11 5 6.5 9H3v6h3.5L11 19z" fill="currentColor" stroke="none"/>'
  + '<path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/>';
function paintEar(){
  $('ear').setAttribute('aria-pressed', String(speakBack));
  $('ear').setAttribute('aria-label', speakBack ? 'Stop reading replies aloud'
                                                : 'Read replies aloud');
  $('ear').title = speakBack ? 'Reading replies aloud' : 'Read replies aloud';
  $('earIcon').innerHTML = speakBack ? EAR_ON : EAR_OFF;
  setMode(callMode);
}
$('ear').onclick = () => { speakBack = !speakBack; paintEar(); };
paintEar();

/* ---- call mode: a conversation, not a screen -------------------------- */
const END_RE = /^\s*(end call|hang up|goodbye|bye|that'?s all|stop the call)\b/i;
async function startCall(){
  if(inCall) return;
  try{ await mic(); }
  catch(e){ turn('friday', 'I need microphone access to take a call.'); return; }
  inCall = true;
  document.body.dataset.call = 'on';
  $('callLbl').textContent = 'On a call';
  $('callBtn').classList.add('hang');
  turn('friday', "I'm listening. Talk whenever you like, and say “end call” when you're done.",
       {first:true});
  loop();
}
function endCall(reason){
  if(!inCall) return;
  inCall = false;
  document.body.dataset.call = 'off';
  $('callLbl').textContent = 'Call';
  $('callBtn').classList.remove('hang');
  setMode('idle');
  releaseMic();
  turn('friday', reason || 'Call ended.');
}
async function loop(){
  while(inCall){
    setMode('hearing');
    const blob = await recordUtterance({silence:1300});
    if(!inCall) break;
    if(!blob) continue;                        // nothing said: keep listening
    setMode('thinking');
    let text = '';
    try{ text = await transcribe(blob); }catch(e){ text = ''; }
    if(!inCall) break;
    if(!text) continue;
    if(END_RE.test(text)){ turn('you', text, {spoken:true}); endCall(); return; }
    const j = await say(text, {spoken:true, fromVoice:true});
    if(!inCall) break;
    if(j && j.reply){
      setMode('speaking');
      await speak(j.reply, true);               // wait, or we transcribe ourselves
    }
  }
}
$('callBtn').onclick = () => inCall ? endCall() : startCall();
$('hangBtn').onclick = () => endCall();

/* ---- composer ---------------------------------------------------------- */
$('send').onclick = () => say();
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(130, input.scrollHeight) + 'px';
});
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); say(); }
});

/* ---- fleet ------------------------------------------------------------- */
function renderFleet(rows){
  const el = $('fleet'); el.textContent = '';
  if(!rows || !rows.length){
    const c = document.createElement('span');
    c.className = 'count'; c.textContent = 'no sessions';
    el.appendChild(c); document.title = 'Friday'; return;
  }
  const needs = rows.filter(r => r.status === 'needs').length;
  const busy = rows.filter(r => r.status === 'working').length;
  document.title = needs ? '(' + needs + ') Friday' : 'Friday';
  const c = document.createElement('span');
  c.className = 'count' + (needs ? ' needs' : '');
  /* Count what is TRUE. Saying "2 running" while both had finished was the
     strip contradicting the conversation. */
  c.textContent = needs ? (needs + ' need' + (needs > 1 ? '' : 's') + ' you')
                        : (busy ? busy + ' working' : rows.length + ' idle');
  el.appendChild(c);
  rows.forEach(r => {
    const b = document.createElement('button');
    b.className = 'sess ' + (r.status === 'needs' ? 'needs'
                 : r.status === 'working' ? 'working' : 'idle');
    const d = document.createElement('span'); d.className = 'd';
    b.append(d, document.createTextNode(r.label || 'session'));
    /* the generated name means nothing to a human ("krishojha-7f"), so the
       real subject rides along as the tooltip */
    b.title = r.needs || r.about || r.status;
    /* Show what it wants and take the answer here. Typing "what does api
       need?" into the chat and waiting for a round trip, to be told a thing
       Friday already knew, is the panel this replaces. */
    b.onclick = () => openPeek(r);
    el.appendChild(b);
  });
}

/* ---- the peek panel ---------------------------------------------------- */
let peeking = null;

function suggestionsFor(q){
  /* Deterministic, from the question itself. A model could write better ones
     and would sometimes invent an option the agent never offered, which is
     worse than none: you would tap it. */
  const text = (q || '').toLowerCase();
  const out = [];
  /* An agent that offered options gets those options back, split at the next
     marker rather than swallowed into one. Lazy, with a lookahead, because a
     greedy match turns "1) rebase 2) merge" into a single button reading
     "rebase 2) merge" that nobody could mean to press. */
  const marks = /(?:^|\s)(?:\d[\).]|[a-c]\))\s*([^\n]{2,40}?)(?=\s+\d[\).]|\s+[a-c]\)|[?.]|$)/g;
  const listed = [...(q || '').matchAll(marks)].map(m => m[1].trim());
  if(listed.length > 1) return listed.slice(0, 4);
  if(/\b(should|shall|do you want|ok to|can i|may i|is it ok)\b/.test(text)
     || /\?\s*$/.test(text)){
    out.push('Yes', 'No');
  }
  if(/\b(which|what)\b/.test(text)) out.push('Tell me the options');
  return out.slice(0, 4);
}

function openPeek(row){
  peeking = row;
  $('peekName').textContent = row.label || 'session';
  $('peekState').textContent = row.status === 'needs' ? 'waiting on you'
                             : row.status === 'working' ? 'working' : 'idle';
  $('peekDot').className = 'd ' + (row.status || 'idle');
  const ask = row.needs || row.about || '';
  $('peekAsk').textContent = ask || 'Nothing pending. Anything you send goes '
                                  + 'straight to it.';
  const box = $('peekSuggest'); box.textContent = '';
  suggestionsFor(row.needs).forEach(label => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => sendPeek(label);
    box.appendChild(b);
  });
  $('peekReply').value = '';
  $('peek').hidden = false;
  setTimeout(() => $('peekReply').focus(), 30);
}

function closePeek(){ $('peek').hidden = true; peeking = null; }

function sendPeek(text){
  const row = peeking;
  const msg = (text !== undefined ? text : $('peekReply').value).trim();
  if(!row || !msg) return;
  closePeek();
  /* One line, not a re-run of the whole question: an ask that has been answered
     should collapse to what you decided. */
  say('tell ' + (row.label || '') + ' ' + msg);
}

$('peekClose').onclick = closePeek;
$('peekSend').onclick = () => sendPeek();
$('peekReply').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); sendPeek(); }
  if(e.key === 'Escape') closePeek();
});
$('peekOpen').onclick = () => { const r = peeking; closePeek();
                                if(r) say('open ' + r.label); };
$('peekStop').onclick = () => { const r = peeking; closePeek();
                                if(r) say('stop ' + r.label); };
$('peek').addEventListener('click', e => { if(e.target === $('peek')) closePeek(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !$('peek').hidden) closePeek();
});

/* ---- who a bare message reaches ---------------------------------------- */
function paintTarget(name){
  const el = $('target');
  if(!name){ el.hidden = true; return; }
  el.hidden = false;
  el.textContent = '';
  el.append(document.createTextNode('replying to '));
  const b = document.createElement('b'); b.textContent = name;
  const clear = document.createElement('button');
  clear.textContent = 'clear';
  clear.onclick = () => { paintTarget(''); say('who am I talking to'); };
  el.append(b, document.createTextNode(' '), clear);
}

/* ---- live -------------------------------------------------------------- */
function connect(){
  const es = new EventSource(U('/events'));
  es.onopen = () => { if(!inCall) $('state').textContent = 'watching'; };
  es.onerror = () => { $('state').textContent = 'reconnecting'; };
  es.onmessage = e => {
    let d; try{ d = JSON.parse(e.data); }catch(x){ return; }
    if(d.kind === 'fleet'){
      renderFleet(d.rows);
      /* The target moves whenever Friday reports on a session, so the chip has
         to follow rather than be set once at load. */
      fetch(U('/state')).then(r => r.json())
        .then(st => paintTarget(st.target || '')).catch(() => {});
    }
    if(d.kind === 'message' && d.message){
      turn('friday', d.message.text, {first: d.message.kind === 'proactive'});
      if(inCall || speakBack) speak(d.message.text, false);
      if(document.hidden) notify(d.message.text);
    }
  };
}
function notify(text){
  try{ if(Notification.permission === 'granted') new Notification('Friday', {body:text}); }
  catch(e){}
}
document.addEventListener('click', function once(){
  try{ if(Notification.permission === 'default') Notification.requestPermission(); }catch(e){}
  document.removeEventListener('click', once);
});

(async function boot(){
  try{
    const s = await (await fetch(U('/state'))).json();
    renderFleet(s.fleet);
    paintTarget(s.target || '');
    (s.history || []).forEach(m => turn(m.role === 'user' ? 'you' : 'friday',
                                        m.text, {first: m.kind === 'proactive'}));
    if(!s.engine.voicebridge)
      turn('friday', "I can't see voicebridge, so I'm half blind: " + s.engine.reason);
    else if(!s.engine.brain)
      turn('friday', 'My brain is still loading. Commands work now; conversation will be thin until it finishes.');
    else if(!(s.history || []).length)
      turn('friday', "I'm watching your sessions. Ask what's running, or press Call and just talk.",
           {first:true});
    thread.scrollTop = thread.scrollHeight;
  }catch(e){}
  connect();
})();

/* ---- alerts on a locked phone ------------------------------------------
   Everything else here assumes a tab is open on a machine you are sitting at.
   This is the part that reaches you when it is not. */
const bellBtn = $('bellBtn');
let pushOn = false;

/* A line from Friday that is NOT a reply: say() would send it as a prompt. */
function notice(text){ turn('friday', text); }

function paintBell(){
  document.body.dataset.push = pushOn ? 'on' : 'off';
  bellBtn.title = pushOn ? 'Alerts on. Tap to turn off.'
                         : 'Get alerts when this is closed';
}

async function pushState(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    if(!reg) return null;
    return await reg.pushManager.getSubscription();
  }catch(e){ return null; }
}

function b64ToBytes(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function enablePush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    notice('This browser cannot do alerts. On an iPhone, add Friday to your home '
        + 'screen first, then turn alerts on from there.');
    return;
  }
  try{
    /* Registered at the ROOT scope: a worker only controls pages at or below
       its own path, so /static/sw.js would control nothing. */
    const reg = await navigator.serviceWorker.register(U('/sw.js'),
                                                       {scope: '/'});
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      notice('Alerts stayed off. Nothing changes until you allow them.');
      return;
    }
    const {key} = await (await fetch(U('/push/key'))).json();
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64ToBytes(key),
    });
    await fetch(U('/push/subscribe'), {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({subscription: sub.toJSON()}),
    });
    pushOn = true; paintBell();
    notice('Alerts are on. I will only buzz you for things that actually need '
        + 'you, and never while you are looking at this page.');
  }catch(e){
    notice('I could not turn alerts on: ' + (e && e.message ? e.message : e)
        + '. Alerts need a secure connection, so over https or Tailscale '
        + 'rather than a plain address.');
  }
}

async function disablePush(){
  const sub = await pushState();
  if(sub){
    try{
      await fetch(U('/push/unsubscribe'), {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({endpoint: sub.endpoint}),
      });
      await sub.unsubscribe();
    }catch(e){ /* the server copy is gone either way */ }
  }
  pushOn = false; paintBell();
  notice('Alerts off.');
}

bellBtn.addEventListener('click', () => pushOn ? disablePush() : enablePush());

/* Tell Friday whether you are actually looking, so it never pushes something
   that is already on the screen in front of you. */
function reportPresence(){
  const visible = document.visibilityState === 'visible' && document.hasFocus();
  fetch(U('/here'), {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({visible}),
  }).catch(() => {});
}
document.addEventListener('visibilitychange', reportPresence);
window.addEventListener('focus', reportPresence);
window.addEventListener('blur', reportPresence);
setInterval(reportPresence, 15000);

pushState().then(sub => { pushOn = !!sub; paintBell(); reportPresence(); });

/* Home-screen shortcuts arrive as ?ask=..., so a long-press on the icon can go
   straight to "who needs me" rather than opening a blank conversation. */
(function(){
  const asked = new URLSearchParams(location.search).get('ask');
  if(!asked) return;
  history.replaceState(null, '', location.pathname
    + (KEY ? '?k=' + encodeURIComponent(KEY) : ''));
  setTimeout(() => say(asked), 400);
})();
</script>
